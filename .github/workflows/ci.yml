name: CI

on:
  push:
    branches: [main, master, cursor/**]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Report dist size
        run: du -sh dist && du -sh dist/* 2>/dev/null | sort -hr | head -10
